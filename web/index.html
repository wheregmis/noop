<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noop</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght,SOFT@9..144,300..600,100&display=swap">
<script>
  // theme: ?theme= → saved → system (same order as allsum)
  (() => { let t = new URLSearchParams(location.search).get("theme"); try { t = t || localStorage.getItem("hubTheme"); } catch {}
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; })();
</script>
<style>
/* Tokens follow allsum-io (web/src/tokens.css, docs/DESIGN.md). */
:root {
  color-scheme: light dark;
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-body: 15px; --fs-h3: 17px; --fs-h1: 27px;
  --lh-body: 1.7; --lh-ui: 1.45;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px;
  --ctl-h: 28px; --row-h: 30px; --topbar-h: 46px; --sidebar-w: 248px; --page-max: 820px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-display: Fraunces, Georgia, "Songti SC", "STSong", "Noto Serif SC", serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --bg: light-dark(#ffffff, #131312);
  --bg-sidebar: light-dark(#f5f6f8, #0e0e0d);
  --bg-page: light-dark(#f7f6f3, #131312);
  --bg-elev: light-dark(#ffffff, #1e1e1d);
  --bg-hover: light-dark(rgba(0,0,0,.045), rgba(255,255,255,.05));
  --bg-active: light-dark(rgba(0,0,0,.075), rgba(255,255,255,.085));
  --bg-inline-code: light-dark(rgba(0,0,0,.055), rgba(255,255,255,.075));
  --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.07));
  --border-strong: light-dark(rgba(0,0,0,.15), rgba(255,255,255,.13));
  --text: light-dark(#1f1e1c, #e6e4df);
  --text-soft: light-dark(#3d3b37, #bebbb4);
  --text-muted: light-dark(#6f6c65, #87847d);
  --text-faint: light-dark(#a19e97, #5a5852);
  --accent: light-dark(#1769e6, #5b9dff);
  --accent-strong: light-dark(#0f57c7, #3d86f5);
  --accent-bg: light-dark(rgba(23,105,230,.07), rgba(91,157,255,.12));
  --accent-border: light-dark(rgba(23,105,230,.5), rgba(91,157,255,.5));
  --on-accent: light-dark(#ffffff, #071226);
  --mint: light-dark(#00c4a0, #00f0c4);
  --busy: light-dark(#d97706, #fbbf24);
  --bad: light-dark(#dc2626, #f87171);
  --focus-ring: var(--accent-border);
  --shadow: 0 6px 20px light-dark(rgba(0,0,0,.1), rgba(0,0,0,.5)), 0 1px 3px light-dark(rgba(0,0,0,.06), rgba(0,0,0,.35)), 0 0 0 1px light-dark(rgba(0,0,0,.07), rgba(255,255,255,.08));
  --shadow-sm: 0 1px 2px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.3)), 0 0 0 1px var(--border);
  --dur-1: 120ms; --dur-2: 200ms; --ease-out: cubic-bezier(.22,1,.36,1);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: var(--fs-sm)/var(--lh-ui) var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-radius: var(--radius-sm); }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; }

/* ---- sidebar ---- */
aside { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { height: var(--topbar-h); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); font-weight: 600; font-size: var(--fs-md); }
.brand .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--text); position: relative; }
.brand .mark::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 2px var(--bg-sidebar); }
.side-scroll { overflow: auto; padding: var(--space-2) var(--space-2) var(--space-4); flex: 1; }
.sec { margin-top: var(--space-4); }
.sec h4 { margin: 0 0 var(--space-1); padding: 0 var(--space-2); font-size: var(--fs-xs); font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: var(--space-2); min-height: var(--row-h); padding: 0 var(--space-2); border-radius: var(--radius-sm); color: var(--text-soft); text-decoration: none; border: 0; background: none; width: 100%; text-align: left; }
.row:hover { background: var(--bg-hover); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: var(--fs-2xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
.dot.on { background: var(--mint); }
.dot.run { background: var(--mint); animation: m-pulse 1.6s ease-in-out infinite; }
.dot.wait { background: var(--accent); }
.badge { font-size: var(--fs-2xs); background: var(--accent-bg); color: var(--accent); border-radius: 999px; padding: 0 6px; line-height: 18px; }
.empty { padding: var(--space-1) var(--space-2); color: var(--text-faint); font-size: var(--fs-xs); }
.meter { height: 3px; border-radius: 2px; background: var(--bg-active); overflow: hidden; width: 44px; }
.meter i { display: block; height: 100%; background: var(--text-muted); }
.side-foot { border-top: 1px solid var(--border); padding: var(--space-2); display: flex; gap: var(--space-1); }

/* ---- main ---- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.topbar { height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border-bottom: 1px solid var(--border); }
.topbar .title { font-weight: 500; font-size: var(--fs-md); flex: 1; }
.topbar .sub { color: var(--text-muted); font-size: var(--fs-xs); }
.icon-btn { height: var(--ctl-h); min-width: var(--ctl-h); padding: 0 var(--space-2); border: 0; background: none; border-radius: var(--radius-sm); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
#menuBtn { display: none; }

.feed { flex: 1; overflow: auto; }
.col { max-width: var(--page-max); margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-6); }
.hello { text-align: center; padding: 12vh 0 var(--space-6); }
.hello h1 { font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-weight: 300; font-size: 34px; letter-spacing: -.01em; margin: 0 0 var(--space-2); }
.hello p { color: var(--text-muted); margin: 0; font-size: var(--fs-md); }

.day { text-align: center; color: var(--text-faint); font-size: var(--fs-xs); margin: var(--space-5) 0 var(--space-3); }
.msg { display: flex; gap: var(--space-3); padding: var(--space-2) 0; animation: m-in var(--dur-2) var(--ease-out); }
.av { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; background: var(--bg-active); color: var(--text-soft); }
.av.hub { background: var(--text); color: var(--bg); }
.bd { flex: 1; min-width: 0; }
.hd { display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: 2px; }
.who { font-weight: 600; font-size: var(--fs-sm); }
.when { color: var(--text-faint); font-size: var(--fs-2xs); }
.tag { font-size: var(--fs-2xs); color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 0 5px; line-height: 16px; }
.tx { font-size: var(--fs-body); line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text); }
.tx code { font-family: var(--mono); font-size: .88em; background: var(--bg-inline-code); padding: 1px 5px; border-radius: var(--radius-xs); }
.card { margin-top: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-elev); padding: var(--space-3); box-shadow: var(--shadow-sm); }
.card.ask { border-color: var(--accent-border); }
.card.done { opacity: .62; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-3); }
.opt { height: var(--ctl-h); padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg); font-size: var(--fs-sm); transition: background var(--dur-1), border-color var(--dur-1); }
.opt:hover { background: var(--bg-hover); }
.opt.rec { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.rec:hover { background: var(--accent-strong); }
.opt.ghost { border-style: dashed; color: var(--text-muted); }
.media { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
.media img, .media video { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-hover); display: block; }
.mine { justify-content: flex-end; }
.mine .bubble { max-width: 78%; background: var(--accent-bg); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); font-size: var(--fs-body); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.mine .ref { display: block; font-size: var(--fs-2xs); color: var(--accent); margin-bottom: 2px; }
.sys .tx { color: var(--text-muted); font-size: var(--fs-sm); }

/* ---- composer ---- */
.composer { flex: none; padding: 0 var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom)); }
.box { max-width: var(--page-max); margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--bg-elev); box-shadow: var(--shadow-sm); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); transition: border-color var(--dur-1); }
.box:focus-within { border-color: var(--accent-border); }
.replying { display: none; font-size: var(--fs-xs); color: var(--accent); align-items: center; gap: var(--space-2); }
.replying.on { display: flex; }
.replying button { border: 0; background: none; color: var(--text-muted); padding: 0; }
.box-row { display: flex; align-items: flex-end; gap: var(--space-2); }
textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: var(--fs-body)/1.55 var(--font); min-height: 26px; max-height: 180px; padding: 3px 0; }
textarea::placeholder { color: var(--text-faint); }
.send { height: var(--ctl-h); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: var(--text); color: var(--bg); font-weight: 500; }
.send:disabled { opacity: .35; cursor: default; }
.hint { max-width: var(--page-max); margin: 6px auto 0; color: var(--text-faint); font-size: var(--fs-2xs); text-align: center; }

/* ---- responsive (allsum layout.ts: md = 768) ---- */
.scrim { display: none; }
@media (max-width: 767px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: min(86vw, 300px); z-index: 20; transform: translateX(-102%); transition: transform var(--dur-2) var(--ease-out); box-shadow: var(--shadow); }
  .app.drawer aside { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  #menuBtn { display: inline-flex; }
  .col { padding: var(--space-4) var(--space-4) var(--space-5); }
  .composer { padding: 0 var(--space-3) calc(var(--space-3) + env(safe-area-inset-bottom)); }
  .mine .bubble { max-width: 88%; }
  .hint { display: none; }
}

@keyframes m-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes m-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><span class="mark"></span>Noop</div>
    <div class="side-scroll">
      <div class="sec"><h4>Needs your decision <span id="nWait"></span></h4><div id="waitList"></div></div>
      <div class="sec"><h4>In progress <span id="nRun"></span></h4><div id="runList"></div></div>
      <div class="sec"><h4>Machines</h4><div id="hostList"></div></div>
      <div class="sec"><h4>Queue</h4><div id="queue"></div></div>
    </div>
    <div class="side-foot">
      <button class="icon-btn" id="themeBtn" title="Switch theme">◐ Theme</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="title">Team channel</div>
      <span class="sub" id="autonomy"></span>
    </div>
    <div class="feed" id="feed"><div class="col" id="log">
      <div class="hello" id="hello"><h1>Good morning</h1><p>The team works in the background. Anything that needs your decision shows up here.</p></div>
    </div></div>
    <div class="composer">
      <div class="box">
        <div class="replying" id="replying"><span id="replyLabel"></span><button id="cancelReply" aria-label="Cancel">✕</button></div>
        <div class="box-row">
          <textarea id="t" rows="1" placeholder="Give the team an instruction, e.g. screenshot-check the nsh gallery example on Linux"></textarea>
          <button class="send" id="send" disabled>Send</button>
        </div>
      </div>
      <div class="hint">⌘/Ctrl + Enter to send · Answer a decision: <code>D-0001 A</code> · Approve a list: <code>P-0001 1,3</code></div>
    </div>
  </main>
</div>
<script>
const qs = new URLSearchParams(location.search);
let token = qs.get("token");
try { token = token || localStorage.getItem("hubToken"); } catch {}
if (qs.get("token")) { try { localStorage.setItem("hubToken", token); } catch {} history.replaceState(null, "", "/"); }
if (!token) { token = prompt("Hub token") || ""; try { localStorage.setItem("hubToken", token); } catch {} }
const H = { Authorization: "Bearer " + token, "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
const log = $("log"), t = $("t"), feedEl = $("feed");
let replyTo = null, last = "", lastDay = "";
const answered = new Set();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
const initials = (n) => (n || "?").replace(/@.*/, "").slice(0, 2).toUpperCase();
const hour = new Date().getHours();
document.querySelector(".hello h1").textContent = hour < 6 ? "Up late" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";

function atBottom() { return feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 80; }
function scrollEnd() { feedEl.scrollTop = feedEl.scrollHeight; }

function choicesOf(e) {
  const o = e.options || [];
  if (e.kind === "menu" || e.kind === "proposals") {
    const nums = o.map((x) => (x.match(/^\s*(\d+|all|none)\b/i) || [])[1]).filter(Boolean);
    return [...new Set(nums)];
  }
  return [...new Set(o.map((x) => (x.match(/^\s*([A-Z])\s*[:：.]/) || [])[1]).filter(Boolean))];
}
function recOf(e) {
  const m = (e.text || "").match(/Recommendation:\s*\*?([^*\s]+)/);
  return m ? m[1] : null;
}

function render(e) {
  $("hello")?.remove();
  last = e.ts > last ? e.ts : last;
  const d = new Date(e.ts), day = d.toLocaleDateString();
  if (day !== lastDay) { lastDay = day; log.insertAdjacentHTML("beforeend", `<div class="day">${day === new Date().toLocaleDateString() ? "Today" : day}</div>`); }
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (e.kind === "owner") {
    if (e.ref) answered.add(e.ref);
    const m = e.text.match(/^\s*([DLP]-[A-Z]?\d{4})\b/); if (m) { answered.add(m[1]); markAnswered(m[1]); }
    log.insertAdjacentHTML("beforeend", `<div class="msg mine"><div class="bubble">${e.ref ? `<span class="ref">↳ ${esc(e.ref)}</span>` : ""}${fmt(e.text)}</div></div>`);
    return;
  }
  const isAsk = e.ref && /^[DLP]-[A-Z]?\d{4}$/.test(e.ref) && ["decision", "menu", "proposals", "login"].includes(e.kind);
  const isHub = /^hub/.test(e.from);
  const el = document.createElement("div");
  el.className = "msg" + (e.kind === "system" ? " sys" : "");
  const label = { decision: "Decision", menu: "Next step", proposals: "To approve", login: "Sign-in", notice: "", system: "" }[e.kind] || "";
  const media = (e.attachments || []).map((a) => {
    const u = a + "?token=" + encodeURIComponent(token);
    return /\.(mp4|webm|mov)$/i.test(a) ? `<video controls playsinline preload="metadata" src="${u}"></video>` : `<a href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt=""></a>`;
  }).join("");
  const body = `<div class="tx">${fmt(e.text)}</div>${media ? `<div class="media">${media}</div>` : ""}`;
  el.innerHTML = `<div class="av ${isHub ? "hub" : ""}">${isHub ? "◆" : initials(e.from)}</div>
    <div class="bd"><div class="hd"><span class="who">${esc(e.from.replace(/@.*/, ""))}</span><span class="when">${time}</span>${label ? `<span class="tag">${label}</span>` : ""}</div>
    ${isAsk ? `<div class="card ask" data-ref="${esc(e.ref)}">${body}<div class="opts"></div></div>` : body}</div>`;
  if (isAsk) {
    const opts = el.querySelector(".opts"), rec = recOf(e);
    for (const c of choicesOf(e).slice(0, 12)) {
      const b = document.createElement("button");
      b.className = "opt" + (rec && rec.split(/[,，]/)[0] === c ? " rec" : "");
      b.textContent = c === "all" ? "All" : c === "none" ? "None" : c;
      b.onclick = () => send(`${e.ref} ${c}`);
      opts.appendChild(b);
    }
    const o = document.createElement("button"); o.className = "opt ghost"; o.textContent = "Other instructions…";
    o.onclick = () => setReply(e.ref);
    opts.appendChild(o);
    if (answered.has(e.ref)) el.querySelector(".card").classList.add("done");
  }
  log.appendChild(el);
}
function markAnswered(ref) { document.querySelectorAll(`.card[data-ref="${ref}"]`).forEach((c) => c.classList.add("done")); }
function setReply(ref) { replyTo = ref; $("replyLabel").textContent = "Reply " + ref; $("replying").classList.add("on"); t.focus(); }
$("cancelReply").onclick = () => { replyTo = null; $("replying").classList.remove("on"); };

async function send(text) {
  const body = JSON.stringify({ text, reply_to: replyTo });
  replyTo = null; $("replying").classList.remove("on");
  await fetch("/api/messages", { method: "POST", headers: H, body });
}
function grow() { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; $("send").disabled = !t.value.trim(); }
t.addEventListener("input", grow);
t.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("send").click(); } });
$("send").onclick = () => { const v = t.value.trim(); if (!v) return; send(v); t.value = ""; grow(); };

async function load() {
  const r = await fetch("/api/feed" + (last ? "?since=" + encodeURIComponent(last) : ""), { headers: H });
  if (r.status === 401) { $("autonomy").textContent = "Invalid token"; return; }
  const stick = atBottom() || !last;
  (await r.json()).events.forEach(render);
  if (stick) scrollEnd();
}

const ago = (iso) => { const s = (Date.now() - Date.parse(iso)) / 1000; return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h"; };
async function status() {
  let s; try { s = await (await fetch("/api/status", { headers: H })).json(); } catch { return; }
  const waits = s.decisions.filter((d) => d.held || d.kind === "proposals");
  $("nWait").innerHTML = waits.length ? `<span class="badge">${waits.length}</span>` : "";
  $("waitList").innerHTML = waits.map((d) => `<button class="row" data-ref="${esc(d.id)}"><span class="dot wait"></span><span class="t">${esc(d.question || d.id)}</span><span class="s">${esc(d.id)}</span></button>`).join("") || `<div class="empty">Nothing pending; the team is moving on its own</div>`;
  $("waitList").querySelectorAll(".row").forEach((r) => r.onclick = () => {
    const c = document.querySelector(`.card[data-ref="${r.dataset.ref}"]`);
    if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); else setReply(r.dataset.ref);
    $("app").classList.remove("drawer");
  });
  $("nRun").textContent = s.active.length || "";
  $("runList").innerHTML = s.active.map((a) => `<div class="row" title="${esc(a.id)}"><span class="dot run"></span><span class="t">${esc(a.title)}</span><span class="s">${esc(a.agent)}</span></div>`).join("") || `<div class="empty">Idle</div>`;
  $("hostList").innerHTML = s.hosts.map((h) => {
    const os = (h.caps.find((c) => c.startsWith("os:")) || "").slice(3);
    const load = Math.min(100, Math.round((h.stats?.loadRatio ?? 0) * 100));
    return `<div class="row"><span class="dot on"></span><span class="t">${esc(h.host)} <span class="s">${esc(os)}</span></span><span class="meter" title="Load ${load}% · Disk ${h.stats?.diskFreeGB ?? "?"}GB · ${h.busy} running"><i style="width:${load}%"></i></span></div>`;
  }).join("") || `<div class="empty">No machines online</div>`;
  const q = s.tasks;
  $("queue").innerHTML = [["To approve", q.proposed], ["Queued", q.inbox], ["Blocked", q.blocked], ["Failed", q.failed], ["Done", q.done]]
    .map(([k, v]) => `<div class="row"><span class="t">${k}</span><span class="s">${v ?? 0}</span></div>`).join("");
}

function stream() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/stream?token=" + encodeURIComponent(token));
  ws.onmessage = (m) => { const stick = atBottom(); render(JSON.parse(m.data)); if (stick) scrollEnd(); status(); };
  ws.onclose = () => setTimeout(() => { load(); stream(); }, 3000);
}

$("menuBtn").onclick = () => $("app").classList.add("drawer");
$("scrim").onclick = () => $("app").classList.remove("drawer");
$("themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; try { localStorage.setItem("hubTheme", next); } catch {}
};
fetch("/api/status", { headers: H }).then(() => {});
load().then(stream); status(); setInterval(status, 15000);
</script>
</body>
</html>
