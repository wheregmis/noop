# Packages the client apps. A tag `vX.Y.Z` publishes them as a GitHub release; pull requests touching this and
# running it by hand only build them (workflow artifacts). Asset names carry no version, so
# `releases/latest/download/<asset>`, which install-client.sh, install-client.ps1 and src/webclient.ts use, always resolves.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-nsh/**
      - scripts/check-ios-sdk.sh
      - scripts/setup-linux-deps.sh
      - install-client.sh
      - install-client.ps1
      - app/build-web.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # `nightly` builds against the commit of the current NSH nightly release and reuses its prebuilt CLI and runtimes,
  # so a release does not compile NSH. Pin a commit only when Noop needs NSH changes the nightly does not have yet.
  # Every job resolves it the same way, so all client runtimes and the OTA package share one commit.
  NSH_REF: nightly

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-24.04, asset: noop-linux-x86_64.tar.gz, installer: install-client.sh }
          - { target: windows, os: windows-latest, asset: noop-windows-x86_64.zip, installer: install-client.ps1 }
          - { target: macos, os: macos-15, asset: noop-macos-arm64.zip, installer: install-client.sh }
          - { target: ios, os: xcode-27, asset: noop-ios-unsigned.ipa }
          - { target: android, os: ubuntu-24.04, asset: noop-android.apk }
          - { target: web, os: ubuntu-24.04, asset: noop-web.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          # Settings › Version shows the release the app was built for.
          [ "$GITHUB_REF_TYPE" != tag ] || printf 'export const CLIENT_VERSION = "%s";\n' "${GITHUB_REF_NAME#v}" > app/version.ts
          out="$RUNNER_TEMP/out"
          mkdir -p assets
          if [ "$TARGET" = android ]; then
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
              keystore="$RUNNER_TEMP/release.jks"
              base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
              args+=(--keystore "$keystore" --key-alias "$ANDROID_KEY_ALIAS")
            elif [ "$GITHUB_REF_TYPE" = tag ]; then
              # Each debug key differs, and Android refuses an update signed with another key.
              echo "::error::a release needs the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD"
              exit 1
            fi
          fi
          if [ "$TARGET" = web ]; then
            (cd app && NSH=nsh ./build-web.sh "${args[@]}")
            tar -czf "assets/$ASSET" -C app/dist/web/noop .
            ls -l assets
            exit 0
          fi
          (cd app && nsh package --target "$TARGET" -o "$out" "${args[@]}")
          case "$TARGET" in
            linux) mv "$out/Noop.tar.gz" "assets/$ASSET"; mv "$out"/Noop-*.tar.gz assets/ ;;
            windows) mv "$out/Noop.zip" "assets/$ASSET"; mv "$out"/Noop-*.zip assets/ ;;
            macos) ditto -c -k --keepParent "$out/Noop.app" "assets/$ASSET"; mv "$out"/Noop-*.tar.gz assets/ ;;
            ios)
              executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$out/Noop.app/Info.plist")
              bash scripts/check-ios-sdk.sh "$out/Noop.app/$executable"
              # Unsigned: sign it with your own Apple ID to install it (Sideloadly, AltStore).
              mkdir "$out/Payload" && mv "$out/Noop.app" "$out/Payload/"
              (cd "$out" && zip -qry - Payload) > "assets/$ASSET" ;;
            android) mv "$out/Noop.apk" "assets/$ASSET" ;;
          esac
          ls -l assets

      - name: Verify the macOS package
        if: matrix.target == 'macos'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app="$RUNNER_TEMP/verify/Noop.app"
          ditto -x -k "assets/$ASSET" "$RUNNER_TEMP/verify"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          codesign --verify --deep --strict "$app"

      - name: Try the installer on this package
        if: matrix.installer != ''
        env:
          ASSET: ${{ matrix.asset }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          (cd assets && { command -v sha256sum > /dev/null && sha256sum "$ASSET" || shasum -a 256 "$ASSET"; } > sha256sums)
          python=python3; command -v python3 > /dev/null || python=python
          (cd assets && exec "$python" -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          export NOOP_CLIENT_BASE_URL=http://127.0.0.1:8765
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -ExecutionPolicy Bypass -File "$INSTALLER"
              test -f "$LOCALAPPDATA/Programs/Noop/Noop.exe" ;;
            macOS)
              bash "$INSTALLER"
              codesign --verify --deep --strict /Applications/Noop.app ;;
            Linux)
              bash "$INSTALLER"
              test -x "$HOME/.local/share/noop-client/Noop"
              test -x "$HOME/.local/bin/noop-client"
              grep -q "^Exec=$HOME/.local/share/noop-client/Noop" "$HOME/.local/share/applications/dev.noop.app.desktop" ;;
          esac
          rm assets/sha256sums

      # Reuse this ARM runner for Intel after packaging and testing the native app.
      # The installer currently supports only Apple silicon; Intel users download the archive.
      - name: Set up Intel nsh
        if: matrix.target == 'macos'
        uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: macos
          rust-target: x86_64-apple-darwin

      - name: Package and verify Intel macOS
        if: matrix.target == 'macos'
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out-x86_64"
          mkdir -p assets-intel
          # The Intel CLI runs through Rosetta and also names OTA archives macos-x86_64.
          (cd app && nsh package --target macos -o "$out" "${args[@]}")
          ditto -c -k --keepParent "$out/Noop.app" assets-intel/noop-macos-x86_64.zip
          mv "$out"/Noop-*-macos-x86_64.tar.gz assets-intel/
          app="$RUNNER_TEMP/verify-x86_64/Noop.app"
          ditto -x -k assets-intel/noop-macos-x86_64.zip "$RUNNER_TEMP/verify-x86_64"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64
          codesign --verify --deep --strict "$app"

      - name: Upload Intel macOS package
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: noop-macos-x86_64.zip
          path: assets-intel/
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: assets/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: linux
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Release file names are lowercase on every project (nsh names its OTA archives after the app, Noop-<version>-...).
      - name: Lowercase asset names
        run: |
          cd assets
          for f in *; do l=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]'); [ "$f" = "$l" ] || mv "$f" "$l"; done
          ls -l
      # OTA: the app's code as a package signed with the release key (certified by the root whose public key is in
      # app/nsh.json). Installed apps on every platform, iOS and Android included, run it from their next launch when
      # its build is newer than theirs and their NSH runtime is new enough; otherwise they take the whole app below.
      # It has this run's build number, as the apps packaged above do, so only older installs pick it up.
      - name: Sign the OTA package
        env:
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf 'export const CLIENT_VERSION = "%s";\n' "$version" > app/version.ts
          keys="$RUNNER_TEMP/keys"
          (umask 077 && mkdir -p "$keys" && printf '%s\n' "$NSH_PACKAGE_KEY" > "$keys/release.secret")
          printf '%s\n' "$NSH_PACKAGE_CERT" > "$keys/release.cert"
          (cd app && nsh publish App.tsx --key "$keys/release.secret" --cert "$keys/release.cert" \
            --build "$GITHUB_RUN_NUMBER" --app-version "$version" -o "$GITHUB_WORKSPACE/assets/noop-$version.nshpkg")
          rm -rf "$keys"
      # The apps fetch `releases/latest/download/latest.json`, the versioned archives and the package next to it
      # (nsh/updater). The installers keep using the unversioned assets. An APK cannot replace itself: Android gets a
      # link for the whole app, and the package for its code.
      - name: Write the update manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' app/nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" app/nsh.json
          nsh update-manifest assets/noop-"$version"-*.tar.gz assets/noop-"$version"-*.zip --entry app --out assets \
            --package assets/noop-"$version".nshpkg \
            --link "android=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/noop-android.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "Noop $GITHUB_REF_NAME"
          fi
